<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Sellwell</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a href="/" class="brand">Sell<span>well</span></a>
  <div class="nav-links"><a href="login.html">Already have an account?</a></div>
</div>

<div class="auth-shell">
  <h2>Create your account</h2>
  <p>Set up your pharmacy's dashboard in a minute.</p>
  <div class="card">
    <form id="registerForm">
      <label for="name">Full name</label>
      <input type="text" id="name" required>
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:18px">Create account</button>
      <div class="error-msg" id="msg"></div>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Registration failed.');
    saveSession(data.token, data.user);
    window.location.href = 'dashboard.html';
  } catch (err) {
    msg.textContent = err.message;
  }
});
</script>
</body>
</html>
